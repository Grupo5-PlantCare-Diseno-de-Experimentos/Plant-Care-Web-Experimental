<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
      <link rel="icon" type="image/png" href="/pc_logo_green.png" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>plantcare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    />
    <script>
      // Aplica el tema persistido antes de montar la app para evitar flash.
      (function () {
        try {
          var mode = localStorage.getItem('app_theme') || 'System';
          var dark = mode === 'Dark' || (mode === 'System' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) { /* sin acceso a localStorage */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </body>
</html>
